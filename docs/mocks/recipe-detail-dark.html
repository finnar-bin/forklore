<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; padding:40px; background:#15191b; font-family:-apple-system,Inter,sans-serif; display:flex; justify-content:center; }
  .rfd{--bg:#232A2E;--card:#2D373C;--text:#D3C6AA;--muted:#889086;--green:#A7C080;--greenl:#B7D19A;--sh1:0 1px 2px rgba(0,0,0,.3);--sh2:0 6px 16px rgba(0,0,0,.4)}
  svg { display:block; }
</style>
</head>
<body>
<div class="rfd" style="width:340px;background:var(--bg);border-radius:20px;overflow:hidden">
  <div style="height:150px;background:linear-gradient(135deg,#4A4530,#39351F);position:relative;display:flex;align-items:center;justify-content:center;color:rgba(211,198,170,.35)">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-2h5L16 7"/></svg>
    <div style="position:absolute;top:14px;left:14px;width:32px;height:32px;border-radius:16px;background:rgba(45,55,60,.85);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh1);color:var(--text)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </div>
  </div>
  <div style="padding:16px;margin-top:-24px;position:relative">
    <div style="background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--sh2)">
      <div style="font-size:18px;font-weight:500;color:var(--text)">Chicken fried rice</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">Family group &middot; 4 servings</div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <div style="flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center">
          <div style="font-size:18px;font-weight:500;color:var(--greenl)">1,240</div>
          <div style="font-size:11px;color:var(--muted)">total kcal</div>
        </div>
        <div style="flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center">
          <div style="font-size:18px;font-weight:500;color:var(--greenl)">310</div>
          <div style="font-size:11px;color:var(--muted)">per serving</div>
        </div>
      </div>
    </div>
  </div>
  <div style="padding:0 16px 16px">
    <div style="font-size:13px;font-weight:500;color:var(--muted);margin-bottom:8px">Ingredients</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="background:var(--card);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh1)">
        <span style="font-size:13px;color:var(--text)">Chicken breast</span>
        <span style="font-size:12px;color:var(--muted)">150 g &middot; 248 kcal</span>
      </div>
      <div style="background:var(--card);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh1)">
        <span style="font-size:13px;color:var(--text)">Egg</span>
        <span style="font-size:12px;color:var(--muted)">2 pieces &middot; 140 kcal</span>
      </div>
      <div style="background:var(--card);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh1)">
        <span style="font-size:13px;color:var(--text)">Cooked rice</span>
        <span style="font-size:12px;color:var(--muted)">400 g &middot; 520 kcal</span>
      </div>
    </div>
  </div>
  <div style="padding:0 16px 20px">
    <div style="background:var(--green);border-radius:12px;padding:12px;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.5)">
      <span style="font-size:14px;font-weight:500;color:#232A2E">Log this recipe</span>
    </div>
  </div>
</div>
</body>
</html>
