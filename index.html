<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget=resizes-content: keeps the on-screen keyboard from
         covering fixed/centered content like MUI Dialog. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#2D373C" />
    <meta
      name="google-site-verification"
      content="cmfOFceMFRrMIEJ6zBV8lxD8w62drYYMGGkJ7po4Hs4"
    />
    <title>Forklore</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Portal target for FABs and other floating elements — sibling to
         #root, not nested inside it, so they stay anchored to the viewport
         even when a screen's content is wrapped in a transformed (animated)
         container. See design-system.md's FAB positioning note and
         docs/pending-deviations.md (Ticket 16). -->
    <div id="floating-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
